<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chris zou</title>
<meta name="description" content="Chris Zou: personal projects built with Claude Code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#hero" data-write>chris zou</a>
  <nav class="links" aria-label="Sections">
    <a href="#projects" data-sec="projects">personal projects</a>
  </nav>
</header>

<main>
  <section class="sec hero" id="hero">
    <div class="intro">
      <div class="who">
        <h1 data-write>chris zou</h1>
        <p class="quote" id="quote">“I have decided to vibe.”</p>
      </div>
      <img class="me" src="assets/me.webp" width="600" height="800" fetchpriority="high" decoding="async" alt="A tan and white dog looking at the camera">
    </div>
    <a class="cue" href="#projects" aria-label="Scroll to projects">scroll</a>
  </section>

  <section class="sec" id="projects">
    <h2 class="page-title" data-write>Personal projects</h2>
    <div class="projects">
      <ul class="plist" id="plist" aria-label="Projects"></ul>
      <div class="detail-col">
        <p class="hint" id="hint" data-write>some games and apps i have developed</p>
        <article class="detail" id="detail" aria-live="polite" hidden>
          <h3 id="d-title" data-write></h3>
          <p class="d-sum" id="d-sum" data-write></p>
          <div class="media">
            <div class="m-main" id="m-main"></div>
            <div class="m-thumbs" id="m-thumbs"></div>
          </div>
          <p class="d-links" id="d-links"></p>
        </article>
      </div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script src="write.js"></script>
<script src="app.js"></script>
</body>
</html>
